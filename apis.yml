aid: mistralai
name: Mistral AI
description: >-
  Mistral AI is a Paris-based artificial intelligence company that develops and
  operates frontier open-weight and commercial large language models, exposed to
  developers and enterprises through La Plateforme (api.mistral.ai). The developer
  platform provides an OpenAI-compatible REST surface spanning chat completions,
  embeddings, content moderation, agents and tool-use, fill-in-the-middle code
  completion (Codestral), document OCR, audio transcription (Voxtral), fine-tuning,
  file management, model management, and asynchronous batch inference. Access is via
  a bearer API key issued from the console, with first-party Python and TypeScript
  SDKs, published pricing, a status page, and a dated changelog.
